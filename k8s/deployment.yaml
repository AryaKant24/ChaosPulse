apiVersion: apps/v1
kind: Deployment
metadata:
  name: chaospulse-deploy
spec:
  replicas: 3
  selector:
    matchLabels:
      app: chaospulse
  template:
    metadata:
      labels:
        app: chaospulse
    spec:
      containers:
      - name: chaospulse
        image: chaospulse:1.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "250m"
            memory: "256Mi"
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5